# Release notes are generated from commit messages. The repository squash-merges
# with the pull request title as the commit subject, so the title has to be a
# Conventional Commit or the changelog silently loses the change.
#
# `pull_request_target` is required here, not incidental: on a plain
# `pull_request` this action cannot read the title of a pull request opened from
# a fork, and forks are where contributions come from. The elevated trigger is
# safe in this workflow because it checks nothing out - there is no step that
# runs contributor code - and the token is narrowed to `pull-requests: read`.
#
# `synchronize` is in the list on purpose: a required check has to report against
# the latest head SHA, so it must re-run on every push to the branch.

name: pr title

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  lint:
    name: pr title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            ci
            chore
          scopes: |
            mtg-deck-publish
          requireScope: false
          # Two bots title their own pull requests and cannot be made to match
          # this convention.
          #
          # Dependabot writes an unknown `deps` scope and a capitalised subject.
          # Its commits are `chore` and hidden from the changelog, so there is
          # nothing for this check to protect there.
          #
          # release-please writes `chore(main): release <package> <version>` -
          # `main` is its own fixed convention for the branch it releases from,
          # not a scope, and it is not configurable without fighting the tool.
          # Adding `main` to the scope list above would have been the other fix
          # and a worse one: it would let any contributor pass with a scope that
          # names nothing. The release pull request's title never reaches the
          # changelog either - release-please writes the changelog itself, from
          # the commits already on main.
          #
          # Only a maintainer or the bot itself can label a pull request, so
          # neither entry is a bypass a contributor can reach. `labeled` and
          # `unlabeled` are in the trigger list above because the label may
          # arrive after the pull request is opened - which is exactly what
          # happens with `autorelease: pending`.
          ignoreLabels: |
            dependencies
            autorelease: pending
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" should start with a lowercase letter.
