# Release notes are generated from commit messages. The repository squash-merges
# with the pull request title as the commit subject, so the title has to be a
# Conventional Commit or the changelog silently loses the change.
#
# `pull_request_target` is required here, not incidental: on a plain
# `pull_request` this action cannot read the title of a pull request opened from
# a fork, and forks are where contributions come from. The elevated trigger is
# safe in this workflow because it checks nothing out - there is no step that
# runs contributor code - and the token is narrowed to `pull-requests: read`.
#
# `synchronize` is in the list on purpose: a required check has to report against
# the latest head SHA, so it must re-run on every push to the branch.

name: pr title

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  lint:
    name: pr title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            ci
            chore
          scopes: |
            mtg-deck-publish
          requireScope: false
          # Dependabot titles its own pull requests, and cannot be made to match
          # this convention reliably - it writes an unknown `deps` scope and a
          # capitalised subject. Its commits are `chore` and hidden from the
          # changelog, so there is nothing for this check to protect there.
          # Only a maintainer can label a pull request, so this is not a bypass
          # a contributor can reach. `labeled`/`unlabeled` are in the trigger
          # list above because the label may arrive after the PR is opened.
          ignoreLabels: |
            dependencies
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" should start with a lowercase letter.
