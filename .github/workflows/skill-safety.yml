# Repository-specific policy checks.
#
# This is the SECONDARY layer. The primary controls are GitHub repository
# rulesets (restrict file paths / file extensions), which are evaluated by
# GitHub itself and cannot be altered by the pull request they govern.
# See docs/repository-setup.md.
#
# Everything here runs from the workflow file, which GitHub takes from the base
# branch for `pull_request` events. Nothing executes a script from the pull
# request's own tree - actions/checkout checks out the merge commit, so any
# script on disk would be the contributor's copy.

name: skill safety

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  scan:
    name: Agent Skill scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner
        run: pip install cisco-ai-skill-scanner
      - name: Scan skills
        run: |
          set -euo pipefail
          for skill in */*/SKILL.md; do
            echo "::group::$(dirname "$skill")"
            skill-scanner scan "$(dirname "$skill")" --format sarif --output "$(dirname "$skill" | tr / -).sarif"
            echo "::endgroup::"
          done
      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .

  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0
      - name: Check added lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          git diff --unified=0 "origin/${BASE_REF}...HEAD" > /tmp/pr.diff
          python3 - <<'PY'
          import re, sys

          # Hosts a skill is allowed to name. A new host in a diff is either a
          # documentation link worth a maintainer glance, or the first half of an
          # exfiltration channel. Either way it stops here.
          ALLOWED = {
              "moxfield.com", "www.moxfield.com", "scryfall.com", "api.scryfall.com",
              "github.com", "docs.github.com", "company.wizards.com",
          }
          # Characters that make the rendered diff differ from what an assistant
          # reads. GitHub warns on the bidirectional ones in its own diff view;
          # this also catches zero-width and soft hyphen.
          INVISIBLE = re.compile("[­​-‏‪-‮⁠-⁤⁦-⁩﻿]")
          URL = re.compile(r"https?://([A-Za-z0-9.\-]+)")

          fails, path = [], "?"
          for line in open("/tmp/pr.diff", encoding="utf-8", errors="replace"):
              if line.startswith("+++ b/"):
                  path = line[6:].strip(); continue
              if not line.startswith("+") or line.startswith("+++"):
                  continue
              added = line[1:]
              for ch in INVISIBLE.findall(added):
                  fails.append(f"{path}: invisible character U+{ord(ch):04X} in an added line")
              for host in URL.findall(added):
                  if host not in ALLOWED:
                      fails.append(f"{path}: new outbound host '{host}'")

          for f in fails:
              print(f"::error:: {f}")
          if fails:
              print(f"\n{len(fails)} blocking issue(s). See SECURITY.md.")
              sys.exit(1)
          print("Repository policy checks passed.")
          PY
