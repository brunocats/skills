# Static analysis of the workflows themselves, using zizmor.
# A CI pipeline that guards a supply chain is part of that supply chain.
#
# `advanced-security: false` is deliberate. In its default mode the action
# uploads SARIF and never fails the job, which makes it a report rather than a
# gate - and the upload cannot succeed on a pull request from a fork, where the
# GITHUB_TOKEN is read-only. Off, it exits non-zero on findings, which is what a
# required status check needs.

name: workflow audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false
